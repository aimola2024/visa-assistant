<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Грузия: ВНЖ и услуги</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: слева — «карточка клиента» как визовое досье, справа — папка с вкладками (требования, деньги, вопросы, анкета, тексты) */
:root{
  --paper:#EEF2EF; --surface:#FFFFFF; --sunk:#F6F8F6; --ink:#15212A; --muted:#5B6870; --line:#D3DBD6;
  --accent:#0C5C57; --accent-2:#13837B; --accent-ink:#FFFFFF; --accent-soft:#DFEDEA;
  --stamp:#A8362B; --stamp-soft:#F7E5E1; --warn:#8A5A00; --warn-soft:#FBF0D8; --ok:#2E7D4F; --ok-soft:#E1F1E7;
  --f-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:12px; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --paper:#0D1317; --surface:#151F25; --sunk:#111A1F; --ink:#E3EAE7; --muted:#93A1A6; --line:#26333A;
  --accent:#58B9AF; --accent-2:#7FD0C7; --accent-ink:#08201E; --accent-soft:#15302D;
  --stamp:#E8877B; --stamp-soft:#3A201C; --warn:#E9BB5F; --warn-soft:#33290F; --ok:#6CC892; --ok-soft:#14301F; color-scheme:dark}}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:15px/1.55 var(--f-body);padding-inline:16px;padding-block:0 40px}
[hidden]{display:none!important}
.wrap{max-width:1320px;margin:0 auto}
h1,h2,h3{text-wrap:balance;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* шапка */
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 24px;padding-block:22px 16px}
.brand{display:flex;align-items:center;gap:14px}
.seal{width:44px;height:44px;border-radius:50%;border:2px solid var(--accent);display:grid;place-items:center;color:var(--accent);font:700 .62rem/1 var(--f-display);letter-spacing:.04em;transform:rotate(-8deg);flex:none}
.brand h1{font:700 1.35rem/1.1 var(--f-display);letter-spacing:-.01em}
.brand p{margin:.25rem 0 0;color:var(--muted);font-size:.86rem}
.access{display:flex;gap:8px;align-items:center;font-size:.82rem;color:var(--muted);white-space:nowrap}
.access input{width:140px}

/* сводка */
.summary{display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 8px 6px 16px;margin-bottom:18px}
.summary .lbl{font:600 .68rem/1 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-right:6px}
.pill{font-size:.84rem;padding:4px 10px;border-radius:999px;background:var(--sunk);border:1px solid var(--line)}
.pill.strong{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}

.work{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,8fr);gap:22px;align-items:start}
@media (max-width:960px){.work{grid-template-columns:minmax(0,1fr)}}

/* досье */
.dossier{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:14px}
.card-h{display:flex;align-items:baseline;gap:10px}
.card-h .no{font:600 .72rem/1 var(--f-mono);color:var(--accent);border:1.5px solid var(--accent);border-radius:6px;padding:3px 6px}
.card-h h2{font:600 1rem/1.2 var(--f-body)}
.label{font:500 .7rem/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:7px}
.row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.row3{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) 90px;gap:10px}
@media (max-width:440px){.row,.row3{grid-template-columns:1fr}}
input[type=text],input[type=password],input[type=date],input[type=number],select,textarea{width:100%;background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:9px 11px}
textarea{resize:vertical;min-height:76px;line-height:1.5}
#client{min-height:120px;font-family:var(--f-mono);font-size:.82rem}
.seg{display:flex;flex-wrap:wrap;background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1 1 auto;border:0;background:none;padding:7px 10px;border-radius:8px;cursor:pointer;color:var(--muted);font-weight:500;font-size:.88rem}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.group{display:flex;flex-direction:column;gap:6px}
.gl{font-size:.8rem;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--sunk);border-radius:999px;padding:5px 11px;cursor:pointer;font-size:.86rem;line-height:1.25}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.chip select{border:0;background:transparent;padding:0;font-size:.86rem}
.hint{font-size:.78rem;color:var(--muted);margin-top:5px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.link{border:0;background:none;padding:0;color:var(--accent);cursor:pointer;text-decoration:underline;text-underline-offset:3px;font-size:.8rem}

/* папка с вкладками */
.folder{position:sticky;top:12px;display:flex;flex-direction:column;min-width:0}
@media (max-width:960px){.folder{position:static}}
.tabs{display:flex;flex-wrap:wrap;gap:4px;padding-left:10px}
.tab{flex:none;border:1px solid var(--line);border-bottom:0;background:var(--sunk);color:var(--muted);border-radius:10px 10px 0 0;padding:8px 13px;cursor:pointer;font-size:.86rem;font-weight:500;position:relative;top:1px}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);font-weight:600}
.tab .ai{font:600 .6rem/1 var(--f-mono);color:var(--accent);margin-left:4px;vertical-align:2px}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;min-height:620px}
.gen{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;padding:14px 18px;border-bottom:1px dashed var(--line);background:var(--sunk);border-radius:var(--r) var(--r) 0 0}
.gen > div{flex:1 1 180px;min-width:0}
.gen .grow{flex:3 1 260px}
.toolbar{display:flex;justify-content:flex-end;gap:8px;padding:10px 18px 0}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:9px 16px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:disabled{opacity:.55;cursor:default}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line);font-weight:500}
.out{padding:14px 26px 24px;overflow-wrap:anywhere;flex:1;max-height:calc(100vh - 210px);overflow-y:auto}
@media (max-width:960px){.out{max-height:none}}
.out h2{font:600 1.18rem/1.3 var(--f-body);margin-bottom:.2em}
.out h3{font:600 .98rem/1.3 var(--f-body);margin:1.4em 0 .45em;display:flex;align-items:center;gap:8px}
.out h3:first-child{margin-top:0}
.out p{margin:.5em 0;max-width:72ch}
.out ul{margin:.4em 0;padding-left:1.25em}
.out li{margin:.25em 0;max-width:70ch}
.out li.chk{list-style:none;margin-left:-1.25em;padding-left:1.6em;position:relative}
.out li.chk::before{content:"";position:absolute;left:0;top:.35em;width:.9em;height:.9em;border:1.5px solid var(--accent);border-radius:3px}
.out a{color:var(--accent)}
.sub{color:var(--muted);font-size:.85rem}
.fill{background:var(--stamp-soft);color:var(--stamp);border-radius:4px;padding:0 4px}
.box{border-radius:10px;padding:10px 14px;margin:.7em 0;font-size:.9rem}
.box.warn{background:var(--warn-soft);color:var(--warn)}
.box.stop{background:var(--stamp-soft);color:var(--stamp)}
.box.ok{background:var(--ok-soft);color:var(--ok)}
.box.info{background:var(--accent-soft)}
.box.comment{background:var(--sunk);border-left:3px solid var(--stamp)}
.kv{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:4px 14px;margin:.4em 0}
.kv dt{color:var(--muted);font-size:.85rem}
.kv dd{margin:0}
.tag{display:inline-block;font:600 .66rem/1 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;padding:3px 6px;border-radius:4px;background:var(--warn-soft);color:var(--warn)}
.big{font:700 2rem/1.1 var(--f-display);letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:var(--accent)}
.prog{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:.6em 0}
.prog b{display:block;margin-bottom:3px}
.tbl{overflow-x:auto;margin:.6em 0;border:1px solid var(--line);border-radius:10px}
.tbl table{border-collapse:collapse;width:100%;min-width:600px;font-size:.86rem}
.tbl th,.tbl td{text-align:left;vertical-align:top;padding:7px 10px;border-bottom:1px solid var(--line)}
.tbl th{font:600 .68rem/1.25 var(--f-mono);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);background:var(--sunk)}
.tbl tr:last-child td{border-bottom:0}
.tbl td.num{font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
.tbl td.ex{font-family:var(--f-mono);font-size:.8rem}
.empty{color:var(--muted);display:flex;flex-direction:column;gap:12px;max-width:50ch;padding-top:10px}
.empty .stamp{align-self:flex-start;font:600 .72rem/1 var(--f-mono);letter-spacing:.12em;color:var(--stamp);border:2px solid var(--stamp);border-radius:6px;padding:6px 10px;transform:rotate(-4deg)}
.thinking{color:var(--muted);font-style:italic}
.note{font-size:.8rem;color:var(--muted);padding:11px 18px;border-top:1px dashed var(--line)}
.note.warn{color:var(--stamp)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.nav{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px}
.nav a{padding:6px 14px;border-radius:999px;text-decoration:none;color:var(--muted);font-weight:500;font-size:.88rem}
.nav a[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}
ol.steps{list-style:none;counter-reset:s;padding:0;margin:.8em 0;display:flex;flex-direction:column;gap:0}
ol.steps li{counter-increment:s;position:relative;padding:0 0 18px 46px;max-width:none}
ol.steps li::before{content:counter(s);position:absolute;left:0;top:0;width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font:600 .85rem/30px var(--f-mono);text-align:center}
ol.steps li::after{content:"";position:absolute;left:14px;top:32px;bottom:2px;width:2px;background:var(--line)}
ol.steps li:last-child::after{display:none}
ol.steps b{display:block}
ol.steps span{color:var(--muted);font-size:.9rem}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="seal" aria-hidden="true">GEO</div>
      <div>
        <h1>Грузия: ВНЖ и услуги</h1>
        <p>ВНЖ, визы D, разрешение на работу, брак, ИП и бухгалтерия, банки — пошагово для юриста</p>
      </div>
    </div>
    <nav class="nav"><a href="index.html">Визы за рубеж</a><a href="georgia.html" aria-current="page">Грузия</a></nav>
    <label class="access" for="code">Код доступа <input type="password" id="code" autocomplete="current-password"></label>
  </header>

  <div class="summary" id="summary" aria-live="polite"></div>

  <div class="work">
    <form class="dossier" id="form" autocomplete="off">
      <section class="card">
        <div class="card-h"><span class="no">01</span><h2>Услуга</h2></div>
        <div class="seg" id="service"></div>
        <div class="group"><span class="gl">Вариант</span><div class="chips" id="variant"></div></div>
      </section>

      <section class="card">
        <div class="card-h"><span class="no">02</span><h2>Клиент</h2></div>
        <div class="group"><span class="gl">Гражданство</span><div class="chips" id="citizen-chips"></div></div>
        <div class="group"><span class="gl">Где сейчас</span>
          <div class="chips" data-single="where">
            <button type="button" class="chip" data-v="in">В Грузии</button><button type="button" class="chip" data-v="abroad">За рубежом</button>
          </div></div>
        <div class="group"><span class="gl">Текущий статус в Грузии</span>
          <div class="chips" data-single="status">
            <button type="button" class="chip" data-v="visafree">Безвиз</button><button type="button" class="chip" data-v="visaD">Виза D</button>
            <button type="button" class="chip" data-v="rp">Есть ВНЖ (продление / смена)</button><button type="button" class="chip" data-v="none">Ещё не въезжал</button>
          </div></div>
        <div class="group"><span class="gl">Семья</span>
          <div class="chips" data-single="family">
            <button type="button" class="chip" data-v="alone">Один</button><button type="button" class="chip" data-v="spouse">С супругом</button><button type="button" class="chip" data-v="kids">С детьми</button>
          </div></div>
        <div class="group"><span class="gl">Документы клиента выданы в</span>
          <div class="chips" data-single="issuer">
            <button type="button" class="chip" data-v="auto">По гражданству</button><button type="button" class="chip" data-v="cis">СНГ / Украина</button>
            <button type="button" class="chip" data-v="hague">Страна Гаагской конвенции</button><button type="button" class="chip" data-v="other">Другая страна</button>
          </div></div>
        <div class="row">
          <div><label class="label" for="entry">Дата въезда в Грузию</label><input type="date" id="entry"></div>
          <div><label class="label" for="expiry">ВНЖ / виза действует до</label><input type="date" id="expiry"></div>
        </div>
      </section>

      <section class="card">
        <div class="card-h"><span class="no">03</span><h2>Детали</h2></div>
        <div><label class="label" for="comments">Важные комментарии</label>
          <textarea id="comments" placeholder="Например: диплом без апостиля, ИП зарегистрирован в июне, оборот 30 000 GEL, муж — гражданин Грузии"></textarea></div>
        <div><label class="label" for="client">Данные клиента</label>
          <textarea id="client" placeholder="ФИО, паспорт, гражданство&#10;Работа / бизнес, доход, оборот&#10;Недвижимость, семья, документы с апостилем…"></textarea>
          <div class="hint">Ответы на вкладке «Вопросы» — сюда. <button type="button" class="link" id="example">Вставить пример</button></div></div>
      </section>
    </form>

    <section class="folder">
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" data-t="overview" aria-selected="true">Обзор</button>
        <button class="tab" role="tab" data-t="steps" aria-selected="false">Пошагово для юриста</button>
        <button class="tab" role="tab" data-t="legal" aria-selected="false">Перевод и апостиль</button>
        <button class="tab" role="tab" data-t="portals" aria-selected="false">Порталы и адреса</button>
        <button class="tab" role="tab" data-t="questions" aria-selected="false">Вопросы клиенту</button>
        <button class="tab" role="tab" data-t="plan" aria-selected="false">План для клиента<span class="ai">AI</span></button>
        <button class="tab" role="tab" data-t="checklist" aria-selected="false">Чек-лист<span class="ai">AI</span></button>
        <button class="tab" role="tab" data-t="poa" aria-selected="false">Доверенность<span class="ai">AI</span></button>
        <button class="tab" role="tab" data-t="reply" aria-selected="false">Ответ клиенту<span class="ai">AI</span></button>
      </div>
      <div class="sheet">
        <div class="gen" id="gen" hidden>
          <div id="lang-wrap"><label class="label" for="lang">Язык</label>
            <select id="lang"><option value="русском">Русский</option><option value="английском">Английский</option><option value="грузинском">Грузинский</option></select></div>
          <div id="question-wrap" class="grow"><label class="label" for="question">Вопрос клиента</label>
            <input type="text" id="question" placeholder="«Можно ли подать на ВНЖ, если безвиз заканчивается через неделю?»"></div>
          <div class="grow"><label class="label" for="extra">Пожелания</label>
            <input type="text" id="extra" placeholder="Например: короче, для представителя Иванова"></div>
          <div style="flex:0 0 auto"><button type="button" class="btn" id="go">Подготовить</button>
            <button type="button" class="btn ghost" id="stop" hidden>Стоп</button></div>
        </div>
        <div class="toolbar">
          <button type="button" class="btn ghost" id="again" hidden>Другой вариант</button>
          <button type="button" class="btn ghost" id="copy">Копировать</button>
        </div>
        <div class="out" id="out"></div>
        <div class="note" id="note"></div>
      </div>
    </section>
  </div>
</div>

<script src="georgia-data.js"></script>
<script>
(() => {
  const G = window.GEO_DATA;
  const $ = (id) => document.getElementById(id);
  const out = $("out"), note = $("note");
  const CENTER = { tone: "вежливо, на «вы», спокойно и по делу, без канцелярита", signature: "" };
  const MAIN_CIT = ["ru", "by", "az", "am", "kz", "ua"];
  const LBL = { where: { in: "в Грузии", abroad: "за рубежом" }, status: { visafree: "безвиз", visaD: "виза D", rp: "есть ВНЖ", none: "ещё не въезжал" }, family: { alone: "один", spouse: "с супругом", kids: "с детьми" } };
  const state = { service: "rp", variant: "work", citizen: "ru", where: "in", status: "visafree", family: "alone", issuer: "auto", tab: "overview" };

  const esc = (s) => String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  const svc = () => G.services.find(s => s.id === state.service);
  const vr = () => svc().variants.find(v => v.id === state.variant) || svc().variants[0];
  const cit = () => G.citizenships.find(c => c.id === state.citizen);
  const fmtDate = (v) => v ? v.split("-").reverse().join(".") : "";

  /* --- форма --- */
  G.services.forEach(s => { const b = document.createElement("button"); b.type = "button"; b.dataset.v = s.id; b.textContent = s.name; b.onclick = () => { state.service = s.id; state.variant = s.variants[0].id; sync(); }; $("service").appendChild(b); });
  const cc = $("citizen-chips");
  MAIN_CIT.forEach(id => { const c = G.citizenships.find(x => x.id === id); const b = document.createElement("button"); b.type = "button"; b.className = "chip"; b.dataset.cit = id; b.textContent = c.name; b.onclick = () => { state.citizen = id; sync(); }; cc.appendChild(b); });
  const more = document.createElement("label"); more.className = "chip"; more.id = "cit-more-wrap";
  more.innerHTML = `<select id="cit-more" aria-label="Другое гражданство"><option value="">Другое…</option>${G.citizenships.filter(c => !MAIN_CIT.includes(c.id)).map(c => `<option value="${c.id}">${c.name}</option>`).join("")}</select>`;
  cc.appendChild(more);
  $("cit-more").onchange = (e) => { if (e.target.value) { state.citizen = e.target.value; sync(); } };
  document.querySelectorAll("[data-single]").forEach(box => box.querySelectorAll(".chip").forEach(b => b.onclick = () => { state[box.dataset.single] = b.dataset.v; sync(); }));
  ["entry", "expiry"].forEach(id => $(id).addEventListener("change", sync));
  $("comments").addEventListener("input", () => { if (state.tab === "overview") renderTab(); });

  function sync() {
    $("service").querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", b.dataset.v === state.service));
    const vbox = $("variant"); vbox.innerHTML = "";
    svc().variants.forEach(v => { const b = document.createElement("button"); b.type = "button"; b.className = "chip"; b.textContent = v.name; b.setAttribute("aria-pressed", v.id === state.variant); b.onclick = () => { state.variant = v.id; sync(); }; vbox.appendChild(b); });
    document.querySelectorAll("[data-single]").forEach(box => box.querySelectorAll(".chip").forEach(b => b.setAttribute("aria-pressed", state[box.dataset.single] === b.dataset.v)));
    cc.querySelectorAll("[data-cit]").forEach(b => b.setAttribute("aria-pressed", state.citizen === b.dataset.cit));
    $("cit-more-wrap").setAttribute("aria-pressed", !MAIN_CIT.includes(state.citizen));
    if (!MAIN_CIT.includes(state.citizen)) $("cit-more").value = state.citizen;
    renderSummary(); renderTab();
  }

  /* --- сроки пребывания --- */

    if (s.deadline) w.push([(s.deadline - new Date()) < 0 ? "stop" : "warn", `Продление ВНЖ — не позднее ${ru(s.deadline)} (за 40 дней до окончания ${ru(s.end)}).`]);
    if (state.where === "abroad" && state.service === "rp") w.push(["warn", "Первичное заявление на ВНЖ подаётся, находясь в Грузии (онлайн из-за рубежа — только продление). Если въезд по безвизу невозможен — сначала виза D."]);

  /* --- обзор --- */
  const li = (a, chk) => `<ul>${a.map(x => `<li${chk ? ' class="chk"' : ""}>${esc(x)}</li>`).join("")}</ul>`;
  function renderOverview() {

    let h = `<h2>${esc(svc().name)} · ${esc(v.name)}</h2><p>${esc(v.sum)}</p>`;
    warnings().forEach(([k, t]) => h += `<div class="box ${k}">${esc(t)}</div>`);
    if (comments) h += `<div class="box comment"><b>Важно по клиенту:</b> ${esc(comments).replace(/\n/g, "<br>")}</div>`;
    h += `<dl class="kv"><dt>Где</dt><dd>${esc(v.where)}</dd><dt>Срок</dt><dd>${esc(v.term)}</dd>${v.deadline ? `<dt>Важно</dt><dd>${esc(v.deadline)}</dd>` : ""}</dl>`;
    h += `<p class="sub">Адреса в Тбилиси и Батуми, ссылки на порталы и инструкции — вкладка «Порталы и адреса»; что переводить и апостилировать — «Перевод и апостиль».</p>`;
    h += `<h3>Условия</h3>${li(v.req)}`;

    h += `<h3>Сборы</h3>${li(v.fees)}`;
    if (state.service === "rp") h += `<p class="sub">${esc(G.general.card)}</p>`;
    if (["rp", "visa", "marriage"].includes(state.service)) h += `<h3>Оформление документов</h3><p>${esc(G.general.docsRule)}</p>`;
    if (state.service === "rp") h += `<p class="sub">${esc(G.general.subsistence)}</p>`;
    h += `<p class="sub">Данные: ${esc(G.checkedAt)}. Правила и сборы меняются — сверяйте с Домом юстиции, МИД Грузии и rs.ge.</p>`;
    out.innerHTML = h; setNote("Отметьте статус и даты слева — сроки посчитаются автоматически.");
  }
  function overviewPlain() {
    const v = vr(), L = [`${svc().name} · ${v.name}`, v.sum, "", ...warnings().map(([, t]) => "⚠ " + t), "", "ГДЕ: " + v.where, "СРОК: " + v.term];
    if (v.deadline) L.push("ВАЖНО: " + v.deadline);

  /* --- пошагово --- */
  function renderSteps() {
    const st = G.steps[state.service] || [];
    let h = `<h2>Пошагово: ${esc(svc().name)} — ${esc(vr().name)}</h2><p class="sub">Порядок работы юриста с клиентом от первой консультации до результата.</p><ol class="steps">`;

  }
  const stepsPlain = () => (G.steps[state.service] || []).map(([t, d], i) => `${i + 1}. ${t} — ${d}`).join("\n");

  /* --- вопросы --- */
  const qList = () => [...G.questions.base, ...(G.questions[state.service] || [])];

    setNote("«Копировать» — список для мессенджера.");
  }


  /* --- перевод и апостиль --- */
  const L = G.legalization;
  const issuerGroup = () => state.issuer === "auto" ? (L.byCitizen[state.citizen] || "hague") : state.issuer;
  function docRows() {
    const grp = L.groups[issuerGroup()];
    return (G.docTable[state.service] || []).map(([doc, kind]) => {
      let a, t, n = "";
      if (kind === "passport") { a = "Не нужен"; t = "Обычно не нужен, если данные есть латиницей"; n = "Иначе — нотариальный перевод на грузинский"; }
      else if (kind === "form") { a = "—"; t = "—"; n = "Заполняется / делается на месте"; }
      else if (kind === "ge") { a = "Для Грузии не нужен"; t = "Не нужен"; n = "Если документ нужен за рубежом — апостиль в Доме юстиции (для стран СНГ обычно не нужен)"; }
      else if (kind === "poa") { a = grp.apost; t = "Нужен — нотариальный, на грузинский"; n = "Доверенность из-за рубежа; банки нередко требуют апостиль даже для стран СНГ — уточните в банке"; }
      else { a = grp.apost; t = "Нужен — нотариальный, на грузинский"; n = grp.note; }

  }
  function renderLegal() {

    h += `<div class="tbl"><table><thead><tr><th>Документ</th><th>Апостиль / легализация</th><th>Перевод на грузинский</th><th>Комментарий</th></tr></thead><tbody>`;
    docRows().forEach(r => h += `<tr><td>${esc(r.doc)}</td><td>${esc(r.a)}</td><td>${esc(r.t)}</td><td>${esc(r.n)}</td></tr>`);

    h += `<h3>Правила по группам стран</h3><div class="tbl"><table><thead><tr><th>Где выдан документ</th><th>Что нужно</th><th>Страны</th></tr></thead><tbody>`;
    Object.values(L.groups).forEach(x => h += `<tr><td>${esc(x.name)}</td><td>${esc(x.apost)}</td><td>${esc(x.list)}</td></tr>`);
    h += `</tbody></table></div><h3>Перевод</h3><p>${esc(L.translation)}</p><h3>Грузинские документы для заграницы</h3><p>${esc(L.outbound)}</p>`;
    h += `<p class="sub">Требования конкретного органа (Дом юстиции, банк, консульство) могут быть строже — уточняйте при подаче.</p>`;
    out.innerHTML = h; setNote("Таблица меняется по услуге и стране выдачи документов.");
  }
  const legalPlain = () => [`Перевод и апостиль — ${svc().name} (${L.groups[issuerGroup()].name})`, ...docRows().map(r => `— ${r.doc}: апостиль — ${r.a}; перевод — ${r.t}. ${r.n}`), "", L.translation].join("\n");

  /* --- порталы и адреса --- */
  function renderPortals() {
    const P = G.portals, list = [...(P[state.service] || []), ...P.common];
    let h = `<h2>Порталы и адреса — ${esc(svc().name)}</h2>`;
    list.forEach(x => {
      h += `<div class="prog"><b>${esc(x.name)}</b><a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.url.replace(/^https?:\/\//, "").replace(/\/$/, ""))}</a>${x.what ? `<br><span class="sub">${esc(x.what)}</span>` : ""}`;
      if (x.how) h += `<ol>${x.how.map(s => `<li>${esc(s)}</li>`).join("")}</ol>`;
      h += `</div>`;
    });
    h += `<h3>Где оформлять — Тбилиси и Батуми</h3><div class="tbl"><table><thead><tr><th>Город</th><th>Офис</th><th>Адрес</th><th>Услуги</th></tr></thead><tbody>`;
    G.offices.list.forEach(o => h += `<tr><td>${esc(o.city)}</td><td>${esc(o.name)}</td><td>${esc(o.address)}</td><td>${esc(o.what)}</td></tr>`);
    h += `</tbody></table></div><p>${esc(G.offices.hotline)}</p><p class="sub">${esc(G.offices.note)}</p>`;
    if (state.service === "bank") h += `<p class="sub">Счета для иностранцев лучше открывать в центральных отделениях банков в Тбилиси или Батуми.</p>`;
    if (state.service === "marriage") h += `<p class="sub">Регистрируют также Дома бракосочетания (торжественная регистрация).</p>`;
    out.innerHTML = h; setNote("Ссылки ведут на официальные сайты.");
  }
  const portalsPlain = () => [...(G.portals[state.service] || []), ...G.portals.common].map(x => `${x.name}: ${x.url}${x.how ? "\n  " + x.how.map((s, i) => `${i + 1}) ${s}`).join("\n  ") : ""}`).concat(G.offices.list.map(o => `${o.city}: ${o.name}, ${o.address}`), [G.offices.hotline]).join("\n");

  /* --- markdown --- */
  const inline = (s) => esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/\[([^\]\n]{2,80})\]/g, '<span class="fill">[$1]</span>');
  function render(md) {
    const lines = md.replace(/\r/g, "").split("\n"); let html = "", list = null, i = 0;
    const close = () => { if (list) { html += `</${list}>`; list = null; } };
    const cells = (r) => r.replace(/^\||\|$/g, "").split("|").map(x => x.trim());
    while (i < lines.length) {
      const l = lines[i].trimEnd(); let m;
      if (/^\s*\|.*\|\s*$/.test(l)) { close(); const rows = []; while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) { rows.push(lines[i].trim()); i++; }
        const body = rows.filter(r => !cells(r).every(x => /^:?-{2,}:?$/.test(x))); const [hd, ...rest] = body;
        html += `<div class="tbl"><table><thead><tr>${cells(hd).map(c => `<th>${inline(c)}</th>`).join("")}</tr></thead><tbody>${rest.map(r => `<tr>${cells(r).map(c => `<td>${inline(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`; continue; }
      if (!l.trim()) { close(); i++; continue; }
      if ((m = l.match(/^#{1,4}\s+(.*)/))) { close(); html += `<h3>${inline(m[1])}</h3>`; }
      else if ((m = l.match(/^\s*[-*•]\s+\[[ xX]?\]\s+(.*)/))) { if (list !== "ul") { close(); html += "<ul>"; list = "ul"; } html += `<li class="chk">${inline(m[1])}</li>`; }
      else if ((m = l.match(/^\s*[-*•]\s+(.*)/))) { if (list !== "ul") { close(); html += "<ul>"; list = "ul"; } html += `<li>${inline(m[1])}</li>`; }
      else if ((m = l.match(/^\s*\d+[.)]\s+(.*)/))) { if (list !== "ol") { close(); html += "<ol>"; list = "ol"; } html += `<li>${inline(m[1])}</li>`; }
      else { close(); html += `<p>${inline(l)}</p>`; }
      i++;
    }
    close(); return html;
  }

  /* --- промпт --- */
  function profile() {
    const s = stay(), p = [`Услуга: ${svc().name} — ${vr().name}`, `Гражданство: ${cit().name}`, `Где сейчас: ${LBL.where[state.where]}`, `Статус: ${LBL.status[state.status]}`, `Семья: ${LBL.family[state.family]}`];
    if ($("entry").value) p.push(`Въезд: ${fmtDate($("entry").value)}`);
    if ($("expiry").value) p.push(`Действует до: ${fmtDate($("expiry").value)}`);
    if (s.end) p.push(`Расчёт: ${s.kind} до ${ru(s.end)}, осталось ${s.left} дн.${s.deadline ? `, продление до ${ru(s.deadline)}` : ""}`);
    return p.join("\n");
  }
  function buildPrompt() {
    const lang = $("lang").value;
    const rules = `ПРАВИЛА:
- Ты — юрист миграционной практики в Грузии. Работай строго по БАЗЕ ниже; если чего-то в базе нет — помечай «(уточнить)».
- Не выдумывай факты о клиенте; нет данных — [что вписать].
- Учитывай ВАЖНЫЕ КОММЕНТАРИИ.
- Не обещай результат решения госорганов.
- Без вступлений. Форматирование: "## ", "- ", "- [ ] ", markdown-таблицы.`;
    const ctx = `ПРОФИЛЬ:\n${profile()}\nВАЖНЫЕ КОММЕНТАРИИ: ${$("comments").value.trim() || "нет"}\n\nБАЗА:\n${overviewPlain()}\n\nПОШАГОВЫЙ ПЛАН (для юриста):\n${stepsPlain()}\n\nПЕРЕВОД И АПОСТИЛЬ:\n${legalPlain()}\n\nПОРТАЛЫ И АДРЕСА:\n${portalsPlain()}\n\nТОН: ${CENTER.tone}${CENTER.signature ? `\nПОДПИСЬ: ${CENTER.signature}` : ""}\n\nДАННЫЕ КЛИЕНТА:\n${$("client").value.trim() || "не указаны"}`;
    const extra = $("extra").value.trim() ? `\n\nПОЖЕЛАНИЯ: ${$("extra").value.trim()}` : "";
    const jobs = {
      plan: `ЗАДАЧА: персональный план для клиента на ${lang} языке: что мы делаем, что нужно от клиента, сроки и стоимость госпошлин. Формат: короткое вступление (1–2 предложения: какую услугу оформляем и почему этот вариант), затем markdown-таблица | Шаг | Что делаем | От клиента | Срок |, затем "## Ключевые даты" (с учётом расчёта сроков из профиля), "## Риски и что проверить" (3–5 пунктов). Для мессенджера или e-mail.`,
      checklist: `ЗАДАЧА: чек-лист документов для клиента на ${lang} языке, для мессенджера. Группы: "## Документы", "## Оформление (апостиль, перевод)", "## Оплата", "## В день подачи". Каждый пункт — что и требование одной фразой. В конце — что делать, если документа нет.`,
      poa: `ЗАДАЧА: проект нотариальной доверенности на ${lang} языке (если язык не грузинский — с пометкой, что для Грузии нужен перевод на грузинский и апостиль при оформлении за рубежом) для услуги «${svc().name} — ${vr().name}». Укажи: доверитель (данные из профиля / [пропуски]), представитель [ФИО, паспорт], полномочия — конкретно под услугу (подача и получение документов в Доме юстиции / банке / rs.ge, подпись заявлений, оплата сборов, получение решений и карт, открытие счёта и т. п.), срок действия, право передоверия (по умолчанию без), место и дата. В конце — "## Примечания для юриста" (что проверить у нотариуса).`,
      reply: `ЗАДАЧА: ответ клиенту на вопрос — на языке вопроса, 3–8 предложений, по тону центра, с конкретным следующим шагом; если ответа нет в базе — предложи уточнить.\nВОПРОС: ${$("question").value.trim() || "[вопрос не указан]"}`
    };
    return `${rules}\n\n${ctx}${extra}\n\n${jobs[state.tab]}`;
  }

  /* --- вкладки --- */
  const AI = ["plan", "checklist", "poa", "reply"], gens = {};
  document.querySelectorAll(".tab").forEach(b => b.onclick = () => openTab(b.dataset.t));
  function openTab(t) {
    state.tab = t;
    document.querySelectorAll(".tab").forEach(x => x.setAttribute("aria-selected", x.dataset.t === t));
    $("gen").hidden = !AI.includes(t); $("question-wrap").hidden = t !== "reply"; $("lang-wrap").hidden = t === "reply";
    $("again").hidden = !gens[t]; renderTab();
  }
  function renderTab() {
    const t = state.tab;
    if (t === "overview") return renderOverview();
    if (t === "steps") return renderSteps();
    if (t === "questions") return renderQuestions();
    if (t === "legal") return renderLegal();
    if (t === "portals") return renderPortals();

    out.innerHTML = `<div class="empty"><span class="stamp">ЧЕРНОВИК</span><p>${t === "poa" ? "Проект доверенности под выбранную услугу — для нотариуса." : t === "plan" ? "Персональный план: шаги, что нужно от клиента, ключевые даты." : "Проверьте досье слева и нажмите «Подготовить»."}</p><p>Где данных нет — пометка <span class="fill">[что вписать]</span>.</p></div>`;
    setNote("Проверяйте текст перед отправкой.");
  }
  function setNote(t, warn) { note.textContent = t; note.classList.toggle("warn", !!warn); }

  /* --- генерация --- */
  let ctl = null;
  try { $("code").value = localStorage.getItem("va-code") || ""; } catch (e) {}
  $("code").addEventListener("change", () => { try { localStorage.setItem("va-code", $("code").value); } catch (e) {} });
  async function run() {
    const t = state.tab;
    if (!$("code").value.trim()) { setNote("Введите код доступа вверху страницы.", true); $("code").focus(); return; }
    if (t === "reply" && !$("question").value.trim()) { setNote("Впишите вопрос клиента.", true); return; }
    const prompt = buildPrompt(); ctl = new AbortController();
    $("go").disabled = true; $("stop").hidden = false; out.innerHTML = '<p class="thinking">Готовлю… обычно 15–40 секунд</p>';
    let text = "";
    try {
      const res = await fetch("/api/generate", { method: "POST", signal: ctl.signal, headers: { "content-type": "application/json" }, body: JSON.stringify({ prompt, code: $("code").value.trim() }) });
      if (!res.ok) { const e = await res.json().catch(() => ({})); throw new Error(e.error || `Ошибка сервера (${res.status})`); }
      const reader = res.body.getReader(), dec = new TextDecoder();
      for (;;) { const { done, value } = await reader.read(); if (done) break; text += dec.decode(value, { stream: true }); gens[t] = text; if (state.tab === t) out.innerHTML = render(text); }
      if (!text.trim()) throw new Error("Пустой ответ. Попробуйте ещё раз.");
      setNote("Проверьте текст перед отправкой.");
    } catch (e) { if (e.name !== "AbortError") { if (!text) { delete gens[t]; out.innerHTML = ""; } setNote(e.message || "Связь прервалась.", true); } }
    finally { $("go").disabled = false; $("stop").hidden = true; $("again").hidden = !gens[state.tab]; }
  }
  $("go").onclick = run; $("again").onclick = run; $("stop").onclick = () => ctl && ctl.abort();
  $("form").addEventListener("submit", (e) => e.preventDefault());
  $("copy").onclick = async () => {
    const t = state.tab;
    const text = t === "overview" ? overviewPlain() : t === "steps" ? stepsPlain() : t === "legal" ? legalPlain() : t === "portals" ? portalsPlain() : t === "questions" ? qList().map((q, i) => `${i + 1}. ${q}`).join("\n") : (gens[t] || "").replace(/^#{1,4}\s+/gm, "").replace(/\*\*(.+?)\*\*/g, "$1").replace(/^- \[ \] /gm, "☐ ");
    if (!text) return;
    try { await navigator.clipboard.writeText(text); setNote("Скопировано."); }
    catch (e) { const r = document.createRange(); r.selectNodeContents(out); const s = getSelection(); s.removeAllRanges(); s.addRange(r); setNote("Текст выделен — нажмите Ctrl+C (⌘+C)."); }
  };
  $("example").onclick = () => {
    $("client").value = `Пример (вымышленный клиент):
Иван Петров, гражданин России, паспорт 75 1234567 до 2032.
В Грузии с 10.02.2026 по безвизу. ИП зарегистрирован 05.06.2026, статус малого бизнеса есть.
Разработчик, работает на компанию из Германии, доход ~4 000 $ в месяц с 2023 года.
Диплом инженера без апостиля. Жена и сын 6 лет — тоже в Грузии.`;
    $("entry").value = "2026-02-10"; state.citizen = "ru"; state.status = "visafree"; state.where = "in"; state.family = "kids"; state.service = "rp"; state.variant = "it"; sync();
  };
  sync();
})();
</script>
